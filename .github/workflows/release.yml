# Kesit App kurulum dosyaları: `v*` etiketi atılınca macOS (DMG, arm64 + Intel)
# ve Windows (NSIS .exe) paketleri derlenir ve GitHub Release'e yüklenir.
# Uygulama içindeki "Güncelleme ara" bu Release'i okur.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_TAG: v1.9.5

jobs:
  # Release'i tek bir iş önceden açar; iki platform aynı anda yükleyince
  # electron-builder aynı etikete iki Release açıyordu.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release'i aç (yoksa)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "Etiket değil ($TAG), Release açılmadı"; exit 0;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Kesit App ${TAG#v}" --notes "$(cat <<'NOTES'
          Kurulum dosyaları: Windows için `.exe`; macOS için `.pkg` (önerilen) ya da `.dmg` — Apple Silicon: `arm64`, Intel: `x64`.

          **macOS ilk açılış:** Paket ad-hoc imzalı, notarize değil. `.pkg` macOS tarafından engellenirse Sistem Ayarları → Gizlilik ve Güvenlik → "Yine de Aç". `.dmg` kullandıysan ve uygulama "hasarlı" derse Terminal'de: `xattr -dr com.apple.quarantine "/Applications/Kesit App.app"`. Sonraki güncellemeleri uygulama kendisi kurar.

          **Windows:** SmartScreen uyarısında "Ek bilgi → Yine de çalıştır".
          NOTES
          )"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Her mimari kendi koşucusunda: ffmpeg/ffprobe ve whisper o mimari için gelir.
          - os: macos-latest
            args: --mac --arm64
            whisper: whisper-mac-arm64
          - os: macos-15-intel
            args: --mac --x64
            whisper: whisper-mac-x64
          - os: windows-latest
            args: --win
            whisper: whisper-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Kök bağımlılıklar
        run: npm ci

      - name: Masaüstü bağımlılıklar
        run: npm ci
        working-directory: desktop

      - name: Testler ve tip denetimi
        run: npm test && npm run typecheck

      - name: Arayüz, sunucu paketi ve ffmpeg
        run: npm run prepare:all
        working-directory: desktop

      # whisper.cpp kaynaktan derlenir ve whisper-cli paketle gelir; kullanıcı
      # hiçbir şey indirmez. (Resmi sürümlerde hazır ikili dosya yok.)
      - name: whisper.cpp derle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch ${{ env.WHISPER_TAG }} https://github.com/ggml-org/whisper.cpp.git whisper-src
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build whisper-src/build --config Release --target whisper-cli --parallel
          Copy-Item whisper-src/build/bin/Release/whisper-cli.exe desktop/bin/whisper-cli.exe
          New-Item -ItemType Directory -Force desktop/release | Out-Null
          Compress-Archive -Path desktop/bin/whisper-cli.exe -DestinationPath desktop/release/${{ matrix.whisper }}.zip -Force
          & desktop/bin/whisper-cli.exe --help | Select-Object -First 2

      - name: whisper.cpp derle (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch ${{ env.WHISPER_TAG }} https://github.com/ggml-org/whisper.cpp.git whisper-src
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build whisper-src/build --config Release --target whisper-cli --parallel
          cp whisper-src/build/bin/whisper-cli desktop/bin/whisper-cli
          chmod +x desktop/bin/whisper-cli
          mkdir -p desktop/release
          (cd desktop/bin && zip -q ../release/${{ matrix.whisper }}.zip whisper-cli)
          desktop/bin/whisper-cli --help | head -2 || true
          file desktop/bin/whisper-cli

      # macOS 15 koşucularında dmgbuild ara sıra "Resource busy" ile düşüyor
      # (Spotlight diski tutuyor); indeksleme kapatılır ve üç deneme yapılır.
      - name: Spotlight'ı kapat (macOS)
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Paketle ve yayınla
        shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder ${{ matrix.args }} --publish always && exit 0
            echo "electron-builder $i. denemede başarısız, 20 sn sonra tekrar"; sleep 20
          done
          exit 1
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # İmza sertifikası yok: macOS'ta ad-hoc imza (package.json: identity "-").
          # İmzasız paket Apple Silicon'da hiç açılmıyordu ("dosya hasarlı").
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: whisper paketini Release'e ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" desktop/release/whisper-*.zip --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: kesit-app-${{ matrix.os }}-${{ matrix.whisper }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.pkg
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.yml
          if-no-files-found: ignore
